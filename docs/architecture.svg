<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">HyperIoT 平台整体架构</text>

  <!-- layer 1: devices -->
  <rect x="30" y="50" width="840" height="86" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="46" y="73" font-size="14" font-weight="700" fill="#111827">设备与边缘层</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <rect x="46" y="88" width="150" height="32" rx="16" fill="#fff" stroke="#9ca3af"/><text x="121" y="109">传感器 / MCU</text>
    <rect x="210" y="88" width="150" height="32" rx="16" fill="#fff" stroke="#9ca3af"/><text x="285" y="109">智能终端 / 车载</text>
    <rect x="374" y="88" width="230" height="32" rx="16" fill="#fff" stroke="#9ca3af"/><text x="489" y="109">边缘网关（Modbus / OPC UA）</text>
    <rect x="618" y="88" width="238" height="32" rx="16" fill="#fff" stroke="#9ca3af"/><text x="737" y="109">LoRa / NB-IoT / 4G / WiFi 接入</text>
  </g>
  <line x1="450" y1="136" x2="450" y2="160" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- layer 2: access -->
  <rect x="30" y="162" width="840" height="86" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="46" y="185" font-size="14" font-weight="700" fill="#111827">接入层（协议适配 · 认证 · 物模型校验）</text>
  <g font-size="12" fill="#92400e" text-anchor="middle">
    <rect x="46" y="200" width="210" height="34" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="151" y="221">MQTT：内置 Broker / EMQX 集群</text>
    <rect x="268" y="200" width="200" height="34" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="368" y="221">TCP 私有协议网关（Netty）</text>
    <rect x="480" y="200" width="170" height="34" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="565" y="221">HTTP 上报网关</text>
    <rect x="662" y="200" width="194" height="34" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="759" y="221">HMAC 认证 / Topic ACL</text>
  </g>
  <line x1="450" y1="248" x2="450" y2="272" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bus -->
  <rect x="30" y="274" width="840" height="52" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="450" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">消息总线：内存总线（单机） / Kafka（集群）</text>
  <text x="450" y="315" text-anchor="middle" font-size="12" fill="#7f1d1d">属性 · 事件 · 状态 · 指令应答 · OTA 进度 —— 按设备分区保序，解耦与削峰</text>
  <line x1="450" y1="326" x2="450" y2="350" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- layer 3: services -->
  <rect x="30" y="352" width="840" height="106" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="46" y="375" font-size="14" font-weight="700" fill="#111827">平台服务层</text>
  <g font-size="13" font-weight="600" fill="#065f46" text-anchor="middle">
    <rect x="46" y="388" width="150" height="56" rx="8" fill="#d1fae5" stroke="#059669"/><text x="121" y="412">设备管理</text><text x="121" y="430" font-size="11" font-weight="400">产品 · 设备 · 状态</text>
    <rect x="208" y="388" width="150" height="56" rx="8" fill="#d1fae5" stroke="#059669"/><text x="283" y="412">物模型 / 影子</text><text x="283" y="430" font-size="11" font-weight="400">校验 · 期望值下发</text>
    <rect x="370" y="388" width="150" height="56" rx="8" fill="#d1fae5" stroke="#059669"/><text x="445" y="412">规则 / 告警</text><text x="445" y="430" font-size="11" font-weight="400">条件 · 动作 · 自动恢复</text>
    <rect x="532" y="388" width="150" height="56" rx="8" fill="#d1fae5" stroke="#059669"/><text x="607" y="412">指令 / OTA</text><text x="607" y="430" font-size="11" font-weight="400">离线排队 · 固件升级</text>
    <rect x="694" y="388" width="162" height="56" rx="8" fill="#d1fae5" stroke="#059669"/><text x="775" y="412">数据处理</text><text x="775" y="430" font-size="11" font-weight="400">批量写入 · 保留策略</text>
  </g>
  <line x1="260" y1="458" x2="260" y2="484" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="458" x2="690" y2="484" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- storage + apps -->
  <rect x="30" y="486" width="520" height="122" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="46" y="509" font-size="14" font-weight="700" fill="#111827">存储</text>
  <g font-size="12" fill="#374151">
    <text x="46" y="532">关系 + 时序：PostgreSQL（单机试用：内置 H2）</text>
    <text x="46" y="552">设备影子 / 在线状态：进程内缓存（Caffeine）</text>
    <text x="46" y="572">固件文件：本地目录（内容寻址，SHA-256）</text>
    <text x="46" y="595" fill="#6b7280" font-style="italic">路线图：TimescaleDB 超表、Redis 共享缓存、对象存储、Flink 流计算</text>
  </g>
  <rect x="570" y="486" width="300" height="122" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="586" y="509" font-size="14" font-weight="700" fill="#111827">应用层</text>
  <g font-size="12" fill="#374151">
    <text x="586" y="532">Web 控制台 · REST API（OpenAPI）</text>
    <text x="586" y="552">WebSocket 实时推送 · Webhook</text>
    <text x="586" y="572">Prometheus 指标 · 健康检查</text>
  </g>
  <text x="450" y="630" text-anchor="middle" font-size="11" fill="#6b7280">图：HyperIoT 分层架构（实线框为已实现，斜体为路线图）</text>
</svg>
